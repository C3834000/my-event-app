[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

# פעם ביום (UTC): שאילתה קלה ל-Supabase — עוזר למנוע השהיית פרויקט Free מחוסר שימוש
[functions."supabase-keepalive"]
  schedule = "@daily"

# תזכורת אוטומטית ללקוחות יומיים לפני האירוע — רץ כל בוקר ב-06:00 UTC (≈09:00 ישראל)
[functions."event-reminders"]
  schedule = "0 6 * * *"

# Route /api/send-email → Netlify Function
[[redirects]]
  from   = "/api/send-email"
  to     = "/.netlify/functions/send-email"
  status = 200

# Route /api/db → Netlify Function (Supabase proxy)
[[redirects]]
  from   = "/api/db"
  to     = "/.netlify/functions/db"
  status = 200

# Route /api/green-invoice → חשבונית ירוקה (API מול השרת בלבד)
[[redirects]]
  from   = "/api/green-invoice"
  to     = "/.netlify/functions/green-invoice"
  status = 200

# SPA fallback – all routes → index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
