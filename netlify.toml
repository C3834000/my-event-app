[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

# פעם ביום (UTC): שאילתה קלה ל-Supabase — עוזר למנוע השהיית פרויקט Free מחוסר שימוש
[functions."supabase-keepalive"]
  schedule = "@daily"

# תזכורת אוטומטית ללקוחות יומיים לפני האירוע — רץ כל בוקר ב-06:00 UTC (≈09:00 ישראל)
[functions."event-reminders"]
  schedule = "0 6 * * *"

# ניקוי לידים שהפכו ללקוחות / הזמינו אירוע — פעם ביום ב-05:00 UTC (≈08:00 ישראל)
[functions."leads-cleanup"]
  schedule = "0 5 * * *"

# Route /api/send-email → Netlify Function
[[redirects]]
  from   = "/api/send-email"
  to     = "/.netlify/functions/send-email"
  status = 200

# Route /api/db → Netlify Function (Supabase proxy)
[[redirects]]
  from   = "/api/db"
  to     = "/.netlify/functions/db"
  status = 200

# Route /api/green-invoice → חשבונית ירוקה (API מול השרת בלבד)
[[redirects]]
  from   = "/api/green-invoice"
  to     = "/.netlify/functions/green-invoice"
  status = 200

# Route /api/calendar.ics → פיד יומן Google (ICS)
[[redirects]]
  from   = "/api/calendar.ics"
  to     = "/.netlify/functions/calendar-ics"
  status = 200

# Route /api/gpt-data → API לקריאה בלבד עבור GPT / כלי ניתוח
[[redirects]]
  from   = "/api/gpt-data"
  to     = "/.netlify/functions/gpt-data"
  status = 200

# Route /api/cashflow → תמונת מצב כספית חיה / פער תזרימי יומי
[[redirects]]
  from   = "/api/cashflow"
  to     = "/.netlify/functions/cashflow"
  status = 200
  force  = true

# Route /api/documents → מאגר מסמכים (שלב ראשון — העלאה ידנית)
[[redirects]]
  from   = "/api/documents"
  to     = "/.netlify/functions/documents"
  status = 200

# SPA fallback – all routes → index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
