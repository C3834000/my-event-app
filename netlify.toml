[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

# פעם ביום (UTC): שאילתה קלה ל-Supabase — עוזר למנוע השהיית פרויקט Free מחוסר שימוש
[functions."supabase-keepalive"]
  schedule = "@daily"

# תזכורת אוטומטית ללקוחות יומיים לפני האירוע — רץ כל בוקר ב-06:00 UTC (≈09:00 ישראל)
[functions."event-reminders"]
  schedule = "0 6 * * *"

# ניקוי לידים שהפכו ללקוחות / הזמינו אירוע — פעם ביום ב-05:00 UTC (≈08:00 ישראל)
[functions."leads-cleanup"]
  schedule = "0 5 * * *"

# API rewrites MUST stay above the SPA fallback. force=true prevents
# a published file (or _redirects catch-all) from serving index.html.
[[redirects]]
  from   = "/api/crm-data"
  to     = "/.netlify/functions/crm-data"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/gpt-data"
  to     = "/.netlify/functions/gpt-data"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/cashflow"
  to     = "/.netlify/functions/cashflow"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/send-email"
  to     = "/.netlify/functions/send-email"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/db"
  to     = "/.netlify/functions/db"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/green-invoice"
  to     = "/.netlify/functions/green-invoice"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/calendar.ics"
  to     = "/.netlify/functions/calendar-ics"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/documents"
  to     = "/.netlify/functions/documents"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api-fallback"
  status = 200
  force  = true

# SPA fallback – frontend routes only. /api/* is handled above.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
